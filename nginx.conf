server {
    listen 80;
    server_name mangosweb.local www.mangosweb.local localhost;
    root D:/OSPanel/home/MangosWeb/public;
    index index.php index.html index.htm;

    # 处理静态文件
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # URL重写规则 - 将所有非文件/目录的请求转发到index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 处理PHP文件
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;  # 根据您的PHP-FPM配置调整
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 安全性设置
    location ~ /\.ht {
        deny all;
    }

    # 隐藏敏感文件
    location ~ \.(env|htaccess|htpasswd|log|sh|inc|bak|old)$ {
        deny all;
    }

    # 日志设置
    access_log D:/OSPanel/home/MangosWeb/storage/logs/nginx-access.log;
    error_log D:/OSPanel/home/MangosWeb/storage/logs/nginx-error.log;
}